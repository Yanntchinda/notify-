services:
  - type: web
    name: transit-roro
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ADMIN_EMAIL
        sync: false
      - key: SMTP_HOST
        sync: false
