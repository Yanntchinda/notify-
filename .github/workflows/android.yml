name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/**'
    tags:
      - 'v*'

env:
  # ── Base Supabase (Project Settings → API) ──────────────────────────────
  # Laissez vide pour compiler en mode démonstration (contenu embarqué,
  # aucune donnée enregistrée). Renseignez-les pour la version réelle.
  SUPABASE_URL: ''
  SUPABASE_ANON_KEY: ''
  # Adresse publique de l'application (liens de réinitialisation du mot de passe)
  PUBLIC_APP_URL: https://votre-domaine.example

jobs:
  apk:
    name: Construire l'APK Android
    runs-on: ubuntu-latest
    # Nécessaire pour joindre l'APK à une Release (téléchargement direct, sans ZIP)
    permissions:
      contents: write
    env:
      # Chaque build porte un numéro de version supérieur : l'installation
      # remplace proprement la version précédente au lieu d'échouer.
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Préparer le SDK Android (préinstallé sur le runner)
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDK Android : $SDK"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          else
            echo "::warning::sdkmanager introuvable — utilisation du SDK préinstallé tel quel"
          fi

      # Clé de signature stable : sans elle, chaque run génère une nouvelle
      # clé de débogage et Android refuse la mise à jour (« Application non
      # installée »). La clé est conservée dans le cache du dépôt.
      - name: Restaurer la clé de signature
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Générer la clé de signature si absente
        run: |
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -alias androiddebugkey -storepass android -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Nouvelle clé de signature générée."
          else
            echo "Clé de signature restaurée depuis le cache."
          fi
          keytool -list -v -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey 2>/dev/null | grep -E "SHA256:|Valid" || true

      - name: Installer les dépendances
        run: npm ci

      - name: Préparer le projet Android (Capacitor)
        run: npm run build:android

      - name: Construire l'APK de débogage (installable directement)
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon \
            -PandroidVersionCode="$ANDROID_VERSION_CODE" \
            -PandroidVersionName="$ANDROID_VERSION_NAME"

      - name: Construire l'APK de release (à signer)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Publier les APK (archive Actions)
        uses: actions/upload-artifact@v4
        with:
          name: transit-apk
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk

      # L'artefact Actions se télécharge toujours en ZIP. La Release, elle,
      # fournit le fichier .apk directement — c'est le lien à donner aux clients.
      - name: Publier l'APK en téléchargement direct
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Application Android — installation directe
          body: |
            Application Android (APK) — build automatique.
            Version **${{ github.run_number }}**.

            **Installation** : télécharger `app-debug.apk`, l'ouvrir sur le téléphone
            et accepter « Sources inconnues ».

            Android 5.0 ou plus récent.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
