name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/**'
    tags:
      - 'v*'

env:
  # ── Base Supabase (Project Settings → API) ──────────────────────────────
  # Laissez vide pour compiler en mode démonstration (contenu embarqué,
  # aucune donnée enregistrée). Renseignez-les pour la version réelle.
  SUPABASE_URL: ''
  SUPABASE_ANON_KEY: ''
  # Adresse publique de l'application (liens de réinitialisation du mot de passe)
  PUBLIC_APP_URL: https://votre-domaine.example

jobs:
  apk:
    name: Construire l'APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Préparer le SDK Android (préinstallé sur le runner)
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDK Android : $SDK"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          else
            echo "::warning::sdkmanager introuvable — utilisation du SDK préinstallé tel quel"
          fi

      - name: Installer les dépendances
        run: npm ci

      - name: Préparer le projet Android (Capacitor)
        run: npm run build:android

      - name: Construire l'APK de débogage (installable directement)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Construire l'APK de release (à signer)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Publier les APK
        uses: actions/upload-artifact@v4
        with:
          name: transit-apk
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
