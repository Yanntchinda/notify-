name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/**'
    tags:
      - 'v*'

env:
  # ── URL de l'application déployée (HTTPS obligatoire) ──────────────────
  # L'APK ouvre cette adresse dans un WebView natif : c'est votre serveur
  # Node.js derrière un nom de domaine et un certificat HTTPS.
  PUBLIC_APP_URL: https://votre-domaine.example

jobs:
  apk:
    name: Construire l'APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Installer les dépendances
        run: npm ci

      - name: Préparer le projet Android (Capacitor)
        run: npm run build:android

      - name: Construire l'APK de débogage (installable directement)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Construire l'APK de release (à signer)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Publier les APK
        uses: actions/upload-artifact@v4
        with:
          name: transit-apk
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
