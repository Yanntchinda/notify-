name: iOS

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/**'
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
    tags:
      - 'v*'

env:
  # ── Base Supabase (Project Settings → API) ──────────────────────────────
  # Laissez vide pour compiler en mode démonstration (contenu embarqué,
  # aucune donnée enregistrée). Renseignez-les pour la version réelle.
  SUPABASE_URL: ''
  SUPABASE_ANON_KEY: ''
  # Adresse publique de l'application (liens de réinitialisation du mot de passe)
  PUBLIC_APP_URL: https://votre-domaine.example

jobs:
  ios:
    name: Construire l'application iOS
    runs-on: macos-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Préparer le projet iOS (Capacitor)
        run: npm run build:ios

      - name: Construire pour le simulateur iOS
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO

      - name: Archiver pour un iPhone (non signé)
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build-device CODE_SIGNING_ALLOWED=NO

      - name: Publier les builds
        uses: actions/upload-artifact@v4
        with:
          name: transit-ios
          if-no-files-found: error
          path: |
            ios/App/build/Build/Products/Debug-iphonesimulator/App.app
            ios/App/build-device/Build/Products/Release-iphoneos/App.app
