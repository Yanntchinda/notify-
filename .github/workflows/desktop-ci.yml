name: Desktop local prototype checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-build:
    name: Test and package local contacts prototype
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out prototype
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: Test local SQLite storage under Node
        working-directory: desktop
        run: npm test
      - name: Test local SQLite storage under Electron
        working-directory: desktop
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE = '1'
          & .\node_modules\.bin\electron.cmd --test test/config.test.cjs test/local-store.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test contacts in the actual Electron window
        working-directory: desktop
        run: npm run test:e2e
      - name: Build prototype installer
        working-directory: desktop
        run: npm run dist:win -- --publish never
      - name: Save experimental local CRM installer (not a release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wacrm-local-prototype-windows
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 7
      - name: Report end-to-end diagnostics
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path desktop/e2e-trace.txt) {
            $text = (Get-Content desktop/e2e-trace.txt -Raw).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Electron diagnostic::$text"
          } else { Write-Output '::error title=Electron diagnostic::No trace file found' }
